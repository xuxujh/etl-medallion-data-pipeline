# Define o sistema de build padrão (PEP 517/518) para instalação modular do projeto
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Metadados formais do pacote de engenharia de dados
[project]
name = "etl_medallion_pipeline"
version = "0.1.0"
description = "Pipeline ETL com arquitetura Medallion, validacao de contratos e processamento colunar"
readme = "README.md"
requires-python = ">=3.11"

# Dependências estritas de produção com limites de versão
dependencies = [
    "pydantic>=2.6.0,<3.0.0",        # Validação de contratos de dados na ingestão (Camada Bronze)
    "pandera>=0.18.0,<1.0.0",        # Validação estatística e de schema em DataFrames (Silver/Gold)
    "polars>=0.20.0,<1.0.0",         # Motor de processamento de DataFrames vetorizado em Rust
    "duckdb>=0.10.0,<2.0.0",         # Banco de dados OLAP in-process para consultas SQL analíticas
    "pyarrow>=15.0.0,<18.0.0",       # Manipulação de memória colunar e escrita de arquivos Parquet
    "pyyaml>=6.0.1,<7.0.0",          # Parser para leitura do arquivo de configuração config.yaml
    "psycopg2-binary>=2.9.9,<3.0.0", # Driver de conexão PostgreSQL para persistência externa
]

# Dependências exclusivas de desenvolvimento e integração contínua (CI/CD)
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",          # Framework para execução de testes unitários e de integração
    "pytest-cov>=4.1.0,<6.0.0",      # Plugin para cálculo da cobertura de testes no código
    "ruff>=0.3.0,<1.0.0",            # Linter e formatador de código em Rust
]

# Configurações do linter Ruff
[tool.ruff]
line-length = 100
target-version = "py311"

# Configurações do executor de testes Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]