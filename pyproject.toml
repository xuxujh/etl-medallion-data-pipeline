[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etl_medallion_pipeline"
version = "0.1.0"
description = "Pipeline de Engenharia de Dados Medallion com Polars, DuckDB e Pydantic v2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0,<2.0.0",
    "duckdb>=0.10.0,<2.0.0",
    "pyarrow>=15.0.0,<20.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "ruff>=0.3.0,<1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]